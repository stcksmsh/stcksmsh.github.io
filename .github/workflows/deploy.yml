name: build & deploy

on:
  push:
    branches: [main]
  # Project repos fire this via repository_dispatch on their io-page push,
  # so a new devlog anywhere rebuilds the site.
  repository_dispatch:
    types: [devlog-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # federate pulls io-page content from every manifest repo, then builds
      - run: npm run build
        env:
          # optional: raises the unauthenticated GitHub API rate limit for
          # the devlog-listing calls in federate.ts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
