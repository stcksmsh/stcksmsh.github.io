name: build & deploy

on:
  push:
    branches: [main]
  # Project repos fire this via the workflow_dispatch API on their io-page
  # push, so a new devlog anywhere rebuilds the site. workflow_dispatch (not
  # repository_dispatch) specifically so their PAT only needs "Actions:
  # write" scope on this repo, not "Contents: write".
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # package-lock.json pins sinteza-viz to a resolved commit SHA, not just
      # the branch — a merge to hysteresis#master (which is what pings this
      # workflow via workflow_dispatch, see notify-site.yml over there) does
      # NOT change that pin, so npm ci alone would silently keep building the
      # old, already-stale code. Re-resolving it here on every build (cheap:
      # one package) is what actually makes "push to hysteresis" reach this
      # site without a separate manual lockfile-bump PR each time — --no-save
      # keeps it out of package.json/package-lock.json, since committing a
      # moving pin on every CI run would just thrash the lockfile for no
      # reproducibility benefit (this is a live-site build, not a release).
      - run: npm install sinteza-viz@github:stcksmsh/hysteresis#master --no-save
      # federate pulls io-page content from every manifest repo, then builds
      - run: npm run build
        env:
          # optional: raises the unauthenticated GitHub API rate limit for
          # the devlog-listing calls in federate.ts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
