# nonslop wiring for stcksmsh.github.io (Astro static site, GitHub Pages).
# Agents are blocked from editing this file; only the owner changes it.

[commands]
# package.json scripts. CI (deploy.yml) runs `npm ci` + `npm run build`, on push to main only.
install = "npm ci"
build = "npm run build"
test = "npm run test:publication"

[slop]
# federated content is gitignored and regenerated; handoff docs are prose, not product code
exclude = ["docs/**"]
# federate.ts's console.log lines are the build's intended status output
warn = ["debug-leftover"]

[done]
branch_prefix = "claude/"
require = ["clean_tree", "pushed", "pr"]
# deploy.yml only runs on push to main, never on pull requests, so the gates run here.
run = ["test", "build"]
gate_timeout_s = 1800
auto_clean = false
min_free_gb = 0
stop_retries = 2

[verify]
run = []

[merge]
guard = true
require = ["verify", "review", "ci"]
# no CI runs on pull requests (deploy.yml is push-to-main only); [done].run gates test + build instead
allow_no_ci = true
coordinator = "ask"

[guard]
secret_read = true

[state]
file = "docs/agent-handoff/STATE.md"

[env]
scratch = ".claude/tmp"

[rules]
notes = [
  "Read AGENTS.md first: architecture, federation, custom page contract, past bugs.",
  "Builds call api.github.com; set GITHUB_TOKEN from `gh auth token` in the environment or repeated builds hit 403 rate limits.",
  "src/content/projects/, src/content/devlogs/, src/generated/projects/, public/generated/projects/ are generated by `npm run federate`. Never commit them.",
  "Federated page/ bundles import fuse.js and react from this site. Do not drop those dependencies.",
  "Root pages use the datasheet design family (--ds-* vars in src/styles/catalogue.css). Do not reintroduce the old glass/visualizer look.",
  "Voice differs per surface: homepage and devlogs casual, CV recruiter-facing.",
]
